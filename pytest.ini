[pytest]
# ---------------------------------------------------------------------------
# CARIVIX-AI – Unified Playwright Test Suite
# pytest.ini  (project root: Testing/CARIVIX-AI/)
# ---------------------------------------------------------------------------

testpaths = carivix_tests

# Custom markers – avoids PytestUnknownMarkWarning
markers =
    backend:  Backend Data Service API tests  (TC-BE-*)
    ml:       ML Model Inference API tests    (TC-ML-*)
    rag:      RAG pipeline unit tests         (TC-ML-03/04/05)
    items:    ML Items CRUD API tests         (fastapi_main)
    slow:     Tests expected to run > 5 s
    smoke:    Quick sanity-check tests
    pending:  Stub tests awaiting team delivery
    neg:      Negative, gibberish & intentional failure tests
    gis:      WebGIS Spatial API tests        (TC-GIS-*)
    nlp:      NLP Intelligence & Routing tests (TC-NLP-*)
    e2e:      End-to-End Multi-Module Integration Workflow tests
    stress:   Rigorous stress, limits, random data, and accuracy tests

# Display options
addopts =
    -v
    --tb=short
    --strict-markers

# Timeout (seconds) – requires pytest-timeout; safe to ignore if not installed
# timeout = 30
