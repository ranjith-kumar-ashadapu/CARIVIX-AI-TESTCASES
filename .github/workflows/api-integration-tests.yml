name: API & Backend Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Backend & Spatial Integration Suite
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Testing/CARIVIX-AI/BACKEND module/requirements.txt"
          pip install pytest playwright pydantic uvicorn fastapi openpyxl
          playwright install --with-deps chromium

      - name: Execute Automated Test Runner
        working-directory: Testing/CARIVIX-AI
        run: |
          python run_api_tests.py --suite all

      - name: Upload Test Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-evidence
          path: |
            Testing/CARIVIX-AI/carivix_tests/reports/carivix_test_report.csv
            Testing/CARIVIX-AI/carivix_tests/reports/carivix_test_report.html
            Testing/CARIVIX_AI_Test_Report.html
            Testing/CARIVIX-AI/carivix_tests/reports/junit_results.xml
